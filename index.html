function loadRemoteBook(cb){
  if(REMOTE_LOADING){if(cb)cb();return}
  REMOTE_LOADING=true;REMOTE_ERROR='';
  fetch(API+'?action=list&_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(j){
      var rows = Array.isArray(j)?j:(j.data||j.rows||[]);
      // Если первая строка — заголовки, отбрасываем
      var start = (rows.length && (String(rows[0][0]).toLowerCase()==='id' || String(rows[0][0]).toLowerCase()==='дата'))?1:0;
      REMOTE_BOOK = rows.slice(start).filter(function(r){return r && r.length}).map(function(row,idx){
        // Поддержка двух форматов: массив колонок или объект
        if(!Array.isArray(row)){
          return {id:String(row.id||idx),shop:row.shop||B.name,status:row.status||'new',time:row.time||'—',date:row.date||'—',svc:[{n:row.svc||row.service||'Заказ',note:''}],name:row.name||'Клиент',phone:row.phone||'—',comment:row.comment||'',price:+row.price||0};
        }
        // Формат CarKeyz: [?, date, name, car, service, ?, time, status, comment?, price?]
        return {
          id:'r'+idx,
          shop:B.name,
          status: row[7] || 'new',
          time: row[6] || '—',
          date: row[1] || '—',
          svc:[{n:row[4]||'Заказ',note:''}],
          name: row[2] || 'Клиент',
          phone: row[3] || row[2] || '—',
          comment: row[8] || '',
          price: +row[9] || 0
        };
      });
      REMOTE_LOADING=false;
      if(cb)cb();
    })
    .catch(function(e){REMOTE_ERROR=String(e);REMOTE_LOADING=false;if(cb)cb()});
}

function sendOrder(b){
  // Отправляем FormData — как в исходном CarKeyz, чтобы работало со старым Apps Script
  var fd=new FormData();
  fd.append('name',b.name);
  fd.append('phone',b.phone);
  fd.append('dishes',b.svc.map(function(s){return s.n}).join(', '));
  fd.append('service',b.svc.map(function(s){return s.n}).join(', '));
  fd.append('date',b.date);
  fd.append('time',b.time);
  fd.append('comment',b.comment);
  fd.append('price',b.price);
  return fetch(API,{method:'POST',body:fd}).catch(function(e){console.error('sendOrder:',e)});
}

var CH={log:[]};
var SYM=[{re:/торт|пирожн|корзинк|кулич|десерт/i,ids:['s3','s4'],say:'Из сладкого — торты, пирожные, корзинки, куличи. На праздник можем сделать торт.'},{re:/беляш|чебурек|пирожок|выпечк|булочк|ватрушк/i,ids:['s2'],say:'Выпечка: беляши, чебуреки, пирожки, булочки.'},{re:/салат/i,ids:['s10'],say:'Салаты свежие, домашние.'},{re:/кофе|капучино|латте/i,ids:['s5'],say:'Кофе с собой.'},{re:/чай/i,ids:['s6'],say:'Чай с собой.'},{re:/лимонад|коктейл|мохито/i,ids:['s7'],say:'Лимонады и молочные коктейли.'},{re:/пицц/i,ids:['s8'],say:'Пицца: гавайская, мохито и др.'},{re:/плов|горяч|обед|гарнир/i,ids:['s1'],say:'Горячее: плов, гарниры.'},{re:/блин|колдун/i,ids:['s11'],say:'Блинчики, колдуны.'},{re:/праздник|стол|гост/i,ids:['s12','s4'],say:'Соберём стол на праздник.'}];
function parsePhone(t){var m=t.match(/\+?\d[\d\s\-()]{8,}\d/);if(m){var d=m[0].replace(/\D/g,'');if(d.length>=10)return m[0].trim()}return null}
function parseName(t,ph){var m=t.match(/меня зовут\s+([А-ЯЁ][а-яё]+)/i);if(m)return m[1];if(ph){var r=t.replace(ph,' ').trim().split(/\s+/).filter(function(w){return /^[А-ЯЁ][а-яё]{2,}$/.test(w)});if(r.length)return r[0]}return null}
function parseDay(t){if(/послезавтра/.test(t))return 2;if(/завтра/.test(t))return 1;if(/сегодня/.test(t))return 0;return null}
function openChat(){$('modal').innerHTML='<div class="veil" data-a="close"><div class="sheet chat"><div class="ch-h"><div class="aibox" style="flex-basis:40px;height:40px;border-radius:12px;font-size:12px">AI</div><div><b>Маша</b><small>консультант</small></div><button class="x" data-a="close">✕</button></div><div id="msgs"></div><div class="cin"><input id="ci" placeholder="Напишите..." autocomplete="off"><button data-a="send">'+ic('send')+'</button></div></div></div>';CH.log=[];say('ai','Здравствуйте! Я Маша. Помогу с заказом. Что нужно?');setTimeout(function(){var i=$('ci');if(i)i.focus()},300)}

function think(t0){var t=t0.toLowerCase();for(var i=0;i<SYM.length;i++){if(SYM[i].re.test(t)){SYM[i].ids.forEach(function(id){S.sel[id]=true});say('ai',SYM[i].say);return}}

if(/телефон|позвон/i.test(t)){say('ai',B.phone);return}
if(/доставк/i.test(t)){say('ai','Доставки нет, только самовывоз.');return}
var ph=parsePhone(t0);if(ph){S.cl.phone=ph;say('ai','Телефон записала: '+ph);return}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';applyLook();save();render(true);return}
  if(a==='go'){go(v);return}
  if(a==='svc'){if(S.sel[id]){delete S.sel[id];delete S.notes[id]}else S.sel[id]=true;render(true);return}
  if(a==='quick'){S.sel={};S.sel[id]=true;S.tab='book';render();return}
  if(a==='slot'){S.slot=v;render(true);return}
  if(a==='open-dates'){datesSheet();return}
  if(a==='pick-date'){S.day=+v;S.slot=null;$('modal').innerHTML='';render(true);return}
  if(a==='cal-prev'){S.cm--;datesSheet();return}
  if(a==='cal-next'){S.cm++;datesSheet();return}
  if(a==='confirm'){var b2=finalize();sheet(b2);render();return}
  if(a==='close'){$('modal').innerHTML='';return}
  if(a==='cancel'){var x=S.book.find(function(z){return String(z.id)===String(id)});if(x)x.status='no';save();render(true);return}
  if(a==='chat'){openChat();return}
  if(a==='send'){send();return}
  if(a==='owner'||a==='secret'){pinSheet();return}
  if(a==='pin'){var p=($('pinin').value||'').trim();if(p===S.pin){S.role='owner';S.tab='o-book';$('modal').innerHTML='';if(!REMOTE_BOOK)loadRemoteBook(function(){render()});else render()}else $('pinerr').textContent='Неверный PIN';return}
  if(a==='refresh'){REMOTE_BOOK=null;loadRemoteBook(function(){render(true)});return}
  if(a==='bk-ok'){updateStatus(id,'ok');if(REMOTE_BOOK){var q=REMOTE_BOOK.find(function(z){return String(z.id)===String(id)});if(q)q.status='ok'}render(true);return}
  if(a==='bk-no'){updateStatus(id,'no');if(REMOTE_BOOK){var q2=REMOTE_BOOK.find(function(z){return String(z.id)===String(id)});if(q2)q2.status='no'}render(true);return}
  if(a==='bk-del'){deleteOrder(id);if(REMOTE_BOOK)REMOTE_BOOK=REMOTE_BOOK.filter(function(z){return String(z.id)!==String(id)});render(true);return}
  if(a==='pin-change'){var op=($('op').value||'').trim(),np=($('np2').value||'').trim();if(op===S.pin&&np.length>=4){S.pin=np;save();toast('PIN изменён');render(true)}else $('perr').textContent='Неверный PIN или короткий новый';return}
  if(a==='u-snd'){L.sound=!L.sound;save();render(true);return}
});

  if(k==='name')S.cl.name=v;
