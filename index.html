function parseDay(t){var d=new Date();d=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(/послезавтра/.test(t))return 2;if(/завтра/.test(t))return 1;if(/сегодня|сейчас/.test(t))return 0;var rel=t.match(/через\s*(\d+)\s*(дн|день|дня)/);if(rel)return Math.min(+rel[1],DAYS-1);if(/через\s*недел/.test(t))return 7;if(/через\s*месяц/.test(t))return 30;var wd={'понедельник':1,'вторник':2,'среда':3,'среду':3,'четверг':4,'пятница':5,'пятницу':5,'суббота':6,'субботу':6,'воскресенье':0};for(var k in wd)if(new RegExp('в\\s*'+k).test(t)){var cur=d.getDay(),diff=(wd[k]-cur+7)%7;if(diff===0)diff=7;return diff}var dm=t.match(/\b(\d{1,2})[.\/](\d{1,2})\b/);if(dm){var dt=new Date(d.getFullYear(),+dm[2]-1,+dm[1]);if(dt<d)dt.setFullYear(dt.getFullYear()+1);var idx=Math.round((dt-d)/864e5);if(idx>=0&&idx<DAYS)return idx}return null}
function parseTime(t){var m=t.match(/\b(\d{1,2})[:.](\d{2})\b/);if(m)return{min:+m[1]*60+ +m[2],exact:m[1]+':'+m[2]};m=t.match(/(?:после|к|в|около|на)\s*(\d{1,2})(?!\d)/);if(m){var h=+m[1];if(h<8)h+=12;if(h>21)h=21;return{min:h*60,exact:null}}if(/утр/.test(t))return{range:[480,720]};if(/обед|днем|днём/.test(t))return{range:[720,960]};if(/вечер/.test(t))return{range:[960,1260]};return null}
function parsePhone(t){var m=t.match(/\+?\d[\d\s\-()]{8,}\d/);if(m){var d=m[0].replace(/\D/g,'');if(d.length>=10)return m[0].trim()}return null}
function parseName(t,phone){var m=t.match(/меня зовут\s+([А-ЯЁ][а-яё]+)/i);if(m)return m[1];m=t.match(/(?:это|я)\s+([А-ЯЁ][а-яё]+)/);if(m)return m[1];if(phone){var rest=t.replace(phone,' ').replace(/[,;]/g,' ').trim();var words=rest.split(/\s+/).filter(function(w){return /^[А-ЯЁ][а-яё]{2,}$/.test(w)&&!BRAND_RE.test(w)});if(words.length)return words[0]}return null}
function parseCar(t){var m=t.match(BRAND_RE);if(!m)return null;var rest=t.slice(m.index+m[0].length).trim().split(/\s+/)[0];var model=rest&&/^[A-Za-zА-Яа-я0-9\-]{2,}$/.test(rest)&&!/^\d+$/.test(rest)?rest:'';return m[0]+(model?' '+model:'')}

function pickSlot(){var f=freeSlots(S.day),p=CH.pref;if(!f.length){say('ai','На '+dlabel(days()[S.day])+' свободных окон нет. Выберем другой день?');CH.day=false;CH.pref=null;S.slot=null;chips(['Завтра','Послезавтра']);return false}var c=f;if(p&&p.range)c=f.filter(function(t){var m=toMin(t);return m>=p.range[0]&&m<p.range[1]});if(!c.length)c=f;var hit=p&&p.min!=null?c.filter(function(t){return toMin(t)>=p.min})[0]:c[0];if(!hit){say('ai','После этого времени мест нет. Ближайшие свободные: '+f.slice(-3).join(', ')+'.');chips(f.slice(-3));CH.pref=null;return false}if(p&&p.exact&&toMin(hit)!==p.min)say('ai','На '+p.exact+' занято, ближайшее свободное: '+hit+'. Поставил его.');S.slot=hit;CH.pref=null;return true}
