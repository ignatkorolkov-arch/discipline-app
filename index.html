function parseDay(t){var d=new Date();d=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(/послезавтра/.test(t))return 2;if(/завтра/.test(t))return 1;if(/сегодня|сейчас/.test(t))return 0;var rel=t.match(/через\s*(\d+)\s*(дн|день|дня)/);if(rel)return Math.min(+rel[1],DAYS-1);if(/через\s*недел/.test(t))return 7;var wd={'понедельник':1,'вторник':2,'среда':3,'среду':3,'четверг':4,'пятница':5,'пятницу':5,'суббота':6,'субботу':6,'воскресенье':0};for(var k in wd)if(new RegExp('в\\s*'+k).test(t)){var cur=d.getDay(),diff=(wd[k]-cur+7)%7;if(diff===0)diff=7;return diff}var dm=t.match(/\b(\d{1,2})[.\/](\d{1,2})\b/);if(dm){var dt=new Date(d.getFullYear(),+dm[2]-1,+dm[1]);if(dt<d)dt.setFullYear(dt.getFullYear()+1);var idx=Math.round((dt-d)/864e5);if(idx>=0&&idx<DAYS)return idx}return null}
