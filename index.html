    +'<div class="grid"><div class="tile glass"><span class="l">Рейтинг</span><div class="big">'+esc(B.rating)+'</div><p>'+B.reviewsCount+' отзывов</p></div><div class="tile glass"><span class="l">Телефон</span><div class="big" style="font-size:15px;margin-top:12px">'+esc(B.phone)+'</div><p>'+esc(B.work)+'</p></div></div>'
    +'<button class="ai-card glass" data-a="chat"><div class="aibox">AI</div><div><b>Маша</b><span>Подберёт блюда и оформит.</span></div></button>'
    +'<h2>Рубрики</h2><div>'+rubs+'</div>'
    +'<h2>Оплата</h2><div>'+pays+'</div>'
    +'<h2>Меню</h2><div class="cr">'+cards+'</div>'
    +'<h2>Фото</h2><div class="cr">'+B.photos.map(function(u){return'<div style="flex:0 0 70%;scroll-snap-align:start;border-radius:24px;overflow:hidden;height:150px"><img src="'+u+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy"></div>'}).join('')+'</div>'
    +'<h2>Отзывы<small>'+B.rating+' · '+B.reviewsCount+'</small></h2>'
    +B.reviews.map(function(r){return'<div class="rev glass"><div class="rh"><div class="av">'+esc(r.n.charAt(0))+'</div><div><div class="rn">'+esc(r.n)+'</div><div class="rs">'+'★'.repeat(r.s)+'</div></div></div><p>'+esc(r.t)+'</p></div>'}).join('')
}

function book(){
  var rows=SV.map(function(s){var on=S.sel[s.id];var r='<button class="row glass '+(on?'on':'')+'" data-a="svc" data-id="'+s.id+'"><span class="th">'+pic(s)+'</span><span class="t"><b>'+esc(s.n)+'</b><small>'+esc(s.w)+'</small></span><span class="pr">'+price(s)+'</span><span class="chk"></span></button>';if(on)r+='<div class="det glass"><label>Детали</label><textarea class="fld" data-f="note" data-id="'+s.id+'" placeholder="'+esc(s.h)+'">'+esc(S.notes[s.id]||'')+'</textarea></div>';return r}).join('');
  var sl=slots().map(function(t,i){return'<button class="slot '+(S.slot===t?'on':'')+'" data-a="slot" data-v="'+t+'"'+(busy(S.day,i,t)?' disabled':'')+'>'+t+'</button>'}).join('');
  if(!sl)sl='<div class="empty glass" style="padding:20px"><p style="margin:0">Вс — выходной.</p></div>';
  return topbar()+'<h1>Оформить</h1>'
    +'<h2 style="margin-top:0">Что взять</h2>'+rows
    +'<h2>Дата</h2><button class="dp glass" data-a="open-dates"><span>'+days()[S.day].toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})+'</span>'+ic('cal')+'</button>'
    +'<h2>Время</h2><div class="slots">'+sl+'</div>'
    +'<h2>Контакты</h2><div class="col"><input class="fld" data-f="name" placeholder="Имя" value="'+esc(S.cl.name)+'"><input class="fld" data-f="phone" type="tel" placeholder="Телефон" value="'+esc(S.cl.phone)+'"><textarea class="fld" data-f="comment" placeholder="Пожелания">'+esc(S.comment)+'</textarea></div>'
}

function mine(){return topbar()+'<h1>Мои</h1>'+(S.book.length?S.book.map(function(b){return bk(b,'client')}).join(''):'<div class="empty glass"><p>Нет заказов.</p></div>')}

var PALETTE=[['Моно',''],['Янтарь','#ff9f0a'],['Томат','#ff5a36'],['Малина','#ff4d8d'],['Мята','#30d158'],['Океан','#0a84ff'],['Фиалка','#8b5cf6'],['Золото','#ffc83d']];
function prof(){
  var pre = PALETTE.map(function(p){return '<button class="pre" data-a="u-pre" data-v="'+p[1]+'"><i style="background:'+(p[1]||'linear-gradient(135deg,#fff 50%,#000 50%)')+'"></i>'+p[0]+'</button>';}).join('');
  var sw = PALETTE.map(function(p){return '<button class="sw'+(L.accent===p[1]?' on':'')+'" data-a="u-acc" data-v="'+p[1]+'" style="background:'+(p[1]||'linear-gradient(135deg,#fff 50%,#000 50%)')+'"></button>';}).join('');
  return topbar()+'<h1>Профиль</h1><div class="col"><input class="fld" data-f="name" placeholder="Имя" value="'+esc(S.cl.name)+'"><input class="fld" data-f="phone" type="tel" placeholder="Телефон" value="'+esc(S.cl.phone)+'"></div>'
    +'<div class="glass ed" style="margin-top:18px"><h3 style="font-size:15px">Оформление</h3><p style="font-size:12.5px;color:var(--sub);margin-top:4px">Цвет кнопок и подсветки.</p>'
    +'<div class="pres">'+pre+'</div>'
    +'<div class="sws">'+sw+'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;margin-top:14px"><label class="sw rb" style="flex-shrink:0"><input type="color" value="'+(L.accent||'#ff9f0a')+'" data-f="u-color"></label><span style="font-size:12px;color:var(--sub)">Свой цвет</span></div>'
    +'<div class="tg"><span>Подсветка фона</span><button class="tsw'+(L.tint?' on':'')+'" data-a="u-tint"></button></div><div class="tg"><span>Звуки</span><button class="tsw'+(L.sound?' on':'')+'" data-a="u-snd"></button></div></div>'
}

function ownerBook(){
  if(REMOTE_BOOK===null && !REMOTE_LOADING) loadRemoteBook(function(){render(true)});
  var list = REMOTE_BOOK || [];
  var nw = list.filter(function(b){return (b.status||'new')==='new'}).length;
  return topbar()+'<h1>Заказы</h1>'
    +'<div style="display:flex;gap:10px;margin-bottom:14px"><button class="b2" data-a="refresh" style="flex:1">'+ic('refresh')+' Обновить</button></div>'
    +(REMOTE_LOADING?'<div class="empty glass"><p>Загрузка...</p></div>':'')
    +(REMOTE_ERROR?'<div class="empty glass"><p style="color:#ff6b60">'+esc(REMOTE_ERROR)+'</p></div>':'')
    +(list.length?list.map(function(b){return bk(b,'owner')}).join(''):(!REMOTE_LOADING&&!REMOTE_ERROR?'<div class="empty glass"><p>Пусто.</p></div>':''))
}

function datesSheet(){var t0=new Date();t0=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate());var ref=new Date(t0.getFullYear(),t0.getMonth()+S.cm,1),first=(ref.getDay()+6)%7,dim=new Date(ref.getFullYear(),ref.getMonth()+1,0).getDate(),c='';for(var i=0;i<first;i++)c+='<span></span>';for(var d=1;d<=dim;d++){var idx=Math.round((new Date(ref.getFullYear(),ref.getMonth(),d)-t0)/864e5),okd=idx>=0&&idx<DAYS&&freeSlots(idx).length>0;c+='<button class="cd'+(idx===S.day?' on':'')+(idx===0?' td':'')+'"'+(okd?' data-a="pick-date" data-v="'+idx+'"':' disabled')+'>'+d+'</button>'}var nextOk=Math.round((new Date(ref.getFullYear(),ref.getMonth()+1,1)-t0)/864e5)<DAYS;$('modal').innerHTML='<div class="veil" data-a="close"><div class="sheet cal"><div class="ch2"><button class="cn" data-a="cal-prev"'+(S.cm<=0?' disabled':'')+'>‹</button><b>'+ref.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</b><button class="cn" data-a="cal-next"'+(nextOk?'':' disabled')+'>›</button></div><div class="cw"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="cg">'+c+'</div></div></div>'}

function finalize(){
  var d=days()[S.day],b={id:'o'+Date.now(),shop:B.name,status:'new',time:S.slot,dayIdx:S.day,dk:d.toDateString(),date:dlabel(d),svc:chosen().map(function(s){return{n:s.n,note:(S.notes[s.id]||'').trim()}}),name:S.cl.name.trim(),phone:S.cl.phone.trim(),comment:S.comment.trim(),price:total()};
  sendOrder(b);
  S.book.unshift(b);save();
  S.sel={};S.notes={};S.slot=null;S.comment='';
  if(REMOTE_BOOK)REMOTE_BOOK.unshift(b);
  return b;
}

function sheet(b){$('modal').innerHTML='<div class="veil" data-a="close"><div class="sheet"><div class="okb" style="width:64px;height:64px;margin:0 auto 14px"><svg viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h3 style="font-size:21px;margin-bottom:8px">Заказ принят</h3><p style="color:var(--sub);line-height:1.55;margin-bottom:22px;font-size:14px">'+esc(b.date)+' в '+esc(b.time)+'<br>'+b.svc.map(function(s){return esc(s.n)}).join(', ')+'<br>'+esc(b.name)+' · '+esc(b.phone)+'</p><button class="cta" data-a="close" style="width:100%">Отлично</button></div></div>'}

function dock(){var h='';if(S.tab==='book'){var bl=blocker();h+='<div class="sum glass"><div class="t"><b>'+(total()?rub(total()):'по запросу')+'</b><small>'+(chosen().length?S.slot||'':'' )+'</small></div><button class="cta" data-a="confirm"'+(bl?' disabled':'')+'>'+(bl||'Оформить')+'</button></div>'}
var T=S.role==='owner'?[['o-book','Заказы','list'],['logout','Выйти','out']]:[['home','Главная','home'],['book','Заказ','plus'],['mine','Мои','list'],['prof','Профиль','user']];
var nw=S.role==='owner'&&REMOTE_BOOK?REMOTE_BOOK.filter(function(b){return(b.status||'new')==='new'}).length:0;
return h+'<nav class="nav" id="nav"><div class="ind" id="ind"></div>'+T.map(function(t){return'<button class="ni '+(S.tab===t[0]?'on':'')+'" data-a="go" data-v="'+t[0]+'">'+ic(t[2])+t[1]+(t[0]==='o-book'&&nw?'<span class="badge">'+nw+'</span>':'')+(t[0]==='mine'&&S.book.length?'<span class="badge">'+S.book.length+'</span>':'')+'</button>'}).join('')+'</nav>'}

var IL=null,IW=0;
function moveInd(){var n=$('nav'),i=$('ind');if(!n||!i)return;var a=n.querySelector('.ni.on');if(!a)return;var nr=n.getBoundingClientRect(),ar=a.getBoundingClientRect(),l=ar.left-nr.left,w=ar.width;if(IL!==null&&Math.abs(IL-l)>2){i.style.transition='none';i.style.left=IL+'px';i.style.width=IW+'px';void i.offsetWidth;i.style.transition=''}i.style.left=l+'px';i.style.width=w+'px';IL=l;IW=w}

var SCR={home:home,book:book,mine:mine,prof:prof,'o-book':ownerBook};
function render(keep){var y=scrollY;$('app').innerHTML=SCR[S.tab]();$('dock').innerHTML=dock();moveInd();scrollTo(0,keep?y:0);setTimeout(moveInd,30);initLongPress();}
function go(t){if(t==='logout'){S.role='client';t='home';REMOTE_BOOK=null}if(t==='o-book'){if(!REMOTE_BOOK)loadRemoteBook(function(){render(true)})}S.tab=t;render()}

function initLongPress(){
  var a = $('ava-btn');
  if(!a) return;
  var t;
  a.onmousedown = a.ontouchstart = function(e){
    t = setTimeout(function(){
      var p = prompt('PIN мастера (1234):');
      if(p === S.pin){ S.role='owner'; S.tab='o-book'; if(!REMOTE_BOOK)loadRemoteBook(function(){render()}); else render(); }
      else if(p !== null) alert('Неверный PIN');
    }, 800);
  };
  a.onmouseup = a.ontouchend = a.onmouseleave = function(){ clearTimeout(t); };
}

var CH={log:[]};
function openChat(){$('modal').innerHTML='<div class="veil" data-a="close"><div class="sheet" style="height:80vh;display:flex;flex-direction:column;padding:0;text-align:left"><div style="padding:20px;border-bottom:1px solid var(--ge);display:flex;justify-content:space-between;align-items:center"><b>Маша (AI)</b><button data-a="close" style="font-size:20px">✕</button></div><div id="msgs" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px"></div><div style="padding:10px;display:flex;gap:8px;border-top:1px solid var(--ge)"><input id="ci" placeholder="Напишите..." style="flex:1;padding:10px;border-radius:10px;border:0;background:var(--in);color:var(--txt)"><button class="cta" data-a="send" style="padding:10px 15px">ОК</button></div></div></div>';CH.log=[];say('ai','Здравствуйте! Что хотите заказать?');setTimeout(function(){var i=$('ci');if(i)i.focus()},300)}
function say(w,t){var m=$('msgs');if(!m)return;var d=document.createElement('div');d.className='m '+w;d.innerText=t;m.appendChild(d);m.scrollTop=m.scrollHeight}
function send(){var i=$('ci');if(!i)return;var v=i.value.trim();if(!v)return;i.value='';say('me',v);setTimeout(function(){think(v)},300)}
function think(t){t=t.toLowerCase();if(/торт|сладк/i.test(t)){S.sel['s3']=true;say('ai','Добавила сладкое в заказ.')}else if(/пирож|беляш/i.test(t)){S.sel['s2']=true;say('ai','Добавила выпечку.')}else if(/кофе/i.test(t)){S.sel['s5']=true;say('ai','Добавила кофе.')}else{say('ai','Не поняла. Позвоните: '+B.phone)}}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a==='u-pre'){L.accent=v;if(!v)L.tint=false;applyLook();save();render(true);return}
  if(a==='u-acc'){L.accent=v;applyLook();save();render(true);return}
  if(a==='u-tint'){L.tint=!L.tint;applyLook();save();render(true);return}
  if(a==='u-snd'){L.sound=!L.sound;save();render(true);return}
  if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';applyLook();save();render(true);return}
  if(a==='go'){go(v);return}
  if(a==='svc'){if(S.sel[id]){delete S.sel[id];delete S.notes[id]}else S.sel[id]=true;render(true);return}
  if(a==='quick'){S.sel={};S.sel[id]=true;S.tab='book';render();return}
  if(a==='slot'){S.slot=v;render(true);return}
  if(a==='open-dates'){datesSheet();return}
  if(a==='pick-date'){S.day=+v;S.slot=null;$('modal').innerHTML='';render(true);return}
  if(a==='cal-prev'){S.cm--;datesSheet();return}
  if(a==='cal-next'){S.cm++;datesSheet();return}
  if(a==='confirm'){var b2=finalize();sheet(b2);render();return}
  if(a==='close'){$('modal').innerHTML='';return}
  if(a==='refresh'){REMOTE_BOOK=null;loadRemoteBook(function(){render(true)});return}
  if(a==='chat'){openChat();return}
  if(a==='send'){send();return}
  if(a==='bk-ok'){updateStatus(id,'ok');if(REMOTE_BOOK){var q=REMOTE_BOOK.find(function(z){return String(z.id)===String(id)});if(q)q.status='ok'}render(true);return}
  if(a==='bk-no'){updateStatus(id,'no');if(REMOTE_BOOK){var q2=REMOTE_BOOK.find(function(z){return String(z.id)===String(id)});if(q2)q2.status='no'}render(true);return}
  if(a==='bk-del'){deleteOrder(id);if(REMOTE_BOOK)REMOTE_BOOK=REMOTE_BOOK.filter(function(z){return String(z.id)!==String(id)});render(true);return}
});
document.addEventListener('input',function(e){var f=e.target.closest('[data-f]');if(!f)return;var k=f.dataset.f,id=f.dataset.id,v=f.value;
  if(k==='name')S.cl.name=v;
  if(k==='phone')S.cl.phone=v;
  if(k==='comment')S.comment=v;
  if(k==='note')S.notes[id]=v;
  if(k==='u-color'){L.accent=v;applyLook();}
  save();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ci'){send()}});

applyLook(); render();
</script>
</body>
</html>
