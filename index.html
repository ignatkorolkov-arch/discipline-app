<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Керамо-Гранит — Столы на заказ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href='data:application/manifest+json,{"name":"Керамо-Гранит","short_name":"Столы","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪨</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
/* ============ БАЗА ============ */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
html,body{overscroll-behavior:none}
body{padding:calc(24px + env(safe-area-inset-top)) 20px 0;max-width:440px;margin:0 auto;min-height:100vh;line-height:1.5;background:var(--bg);color:var(--txt);transition:background .4s}
body.dark{--bg:#000;--gb:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 45%,rgba(255,255,255,.04));--ge:rgba(255,255,255,.15);--txt:#fff;--sub:rgba(255,255,255,.68);--sh:rgba(0,0,0,.6);--in:rgba(255,255,255,.06);--acc:linear-gradient(180deg,#fff,#d6d6d6);--af:#000;--ag:rgba(255,255,255,.3);--amb:.1;color-scheme:dark}
body.light{--bg:#e6e6e6;--gb:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.2) 50%,rgba(255,255,255,.5));--ge:rgba(0,0,0,.1);--txt:#000;--sub:rgba(0,0,0,.6);--sh:rgba(0,0,0,.14);--in:rgba(0,0,0,.05);--acc:linear-gradient(180deg,#2c2c2c,#000);--af:#fff;--ag:rgba(0,0,0,.25);--amb:.1;color-scheme:light}
body[data-tint]{--amb:.22}

/* Плавная смена темы */
body, .glass, .nav, .sheet { transition: background .5s ease, color .5s ease, box-shadow .5s ease; }

/* ============ АНИМИРОВАННЫЙ ФОН ============ */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.ambient i{position:absolute;width:70vmax;height:70vmax;max-width:520px;max-height:520px;border-radius:50%;filter:blur(80px);opacity:var(--amb);animation:drift 20s ease-in-out infinite alternate;background:var(--accent,var(--txt))}
.ambient i:nth-child(1){top:-12%;left:-25%}
.ambient i:nth-child(2){top:35%;right:-30%;animation-duration:26s;animation-delay:-8s;filter:blur(80px) brightness(.7)}
.ambient i:nth-child(3){bottom:-15%;left:5%;animation-duration:30s;animation-delay:-14s;filter:blur(80px) brightness(.5)}
@keyframes drift{to{transform:translate3d(10vw,-5vh,0) scale(1.1)}}

/* ============ ЖИДКОЕ СТЕКЛО ============ */
.glass,.sheet,.nav{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--gb);
  -webkit-backdrop-filter:blur(16px) saturate(200%);
  backdrop-filter:blur(16px) saturate(200%);
  border-radius:28px;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.25), box-shadow .3s, background .3s;
  animation: glassEnter .6s cubic-bezier(.2,.9,.3,1.25) both;
}
.glass:nth-child(1){animation-delay: 0.05s}
.glass:nth-child(2){animation-delay: 0.1s}
.glass:nth-child(3){animation-delay: 0.15s}
.glass:nth-child(4){animation-delay: 0.2s}
.glass:nth-child(5){animation-delay: 0.25s}

@keyframes glassEnter {
  0% { opacity: 0; transform: translateY(24px) scale(.92); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.glass:active { transform: scale(.97); transition: transform .1s; }

/* Движущийся блик */
.glass::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background: radial-gradient(circle 200px at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.15), transparent 60%);
  transition: background .1s ease-out;
}

/* Объемные тени */
.sheet,.nav{-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%)}
body.dark :is(.glass,.sheet,.nav){box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.06),inset 10px 10px 24px -16px rgba(255,255,255,.2),0 14px 34px rgba(0,0,0,.55)}
body.light :is(.glass,.sheet,.nav){box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(0,0,0,.06),0 14px 32px rgba(0,0,0,.13)}

/* Кнопки */
.fab,.cta,.aibox, .go {transition: transform .2s cubic-bezier(.2,.9,.3,1.25), box-shadow .3s, filter .3s;}
.fab:active, .cta:active, .aibox:active, .go:active {transform: scale(.92);}
.fab {animation: float 3s ease-in-out infinite;}
@keyframes float {0%, 100% {transform: translateY(0);} 50% {transform: translateY(-4px);}}

/* ============ ИНТЕРФЕЙС ============ */
html.refract .glass{-webkit-backdrop-filter:url(#gm) blur(8px) saturate(190%);backdrop-filter:url(#gm) blur(8px) saturate(190%)}
html.refract :is(.sheet,.nav){-webkit-backdrop-filter:url(#gm) blur(18px) saturate(200%);backdrop-filter:url(#gm) blur(18px) saturate(200%)}
svg.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
h1{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:6px 2px 18px;color:var(--accent-t,var(--txt))}
h2{font-size:15px;margin:24px 4px 12px;font-weight:600}h2 small{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:8px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px;margin-bottom:16px;gap:10px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd{display:flex;gap:8px;align-items:center}
.ava,.tb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge),inset 0 1px 0 rgba(255,255,255,.2)}
.tb:active{transform:scale(.92)}.tb svg{width:18px;height:18px}
.own{font-size:11px;padding:6px 12px;border-radius:99px;font-weight:700;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge)}
.hero{padding:0;border-radius:30px;min-height:120px}.hero .art{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.go{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--af);box-shadow:0 6px 20px var(--ag);transition:transform .25s}
.hero-t{padding:16px 4px 0}.hero-t h3{font-size:21px;letter-spacing:-.02em}.hero-t p{color:var(--sub);font-size:14px;margin-top:6px}
.grid,.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{margin-top:14px}.two{gap:10px}
.tile{padding:16px;border-radius:24px}.tile .l{font-size:12.5px;color:var(--sub)}.big{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;color:var(--accent-t,var(--txt))}.tile p{font-size:12.5px;color:var(--sub)}
.ai-card{display:flex;gap:14px;align-items:center;padding:16px;width:100%;text-align:left;margin-top:14px;border-radius:24px}
.aibox{flex:0 0 48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--acc);color:var(--af);box-shadow:0 4px 14px var(--ag)}
.ai-card b{display:block;font-size:16px}.ai-card span{color:var(--sub);font-size:13px;line-height:1.4;display:block;margin-top:3px}
.cr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 14px;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}
.sc{flex:0 0 80%;scroll-snap-align:start;text-align:left;padding:0;border-radius:24px}
.sc .art{display:block;width:100%;height:150px;object-fit:cover}.sc .bd{padding:14px 16px 16px}.sc h3{font-size:17px}
.sc p{font-size:13.5px;color:var(--sub);line-height:1.45;margin:6px 0 12px;min-height:58px}
.mt{display:flex;align-items:center;justify-content:space-between;font-size:14px}.pill{padding:5px 10px;border-radius:99px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge);font-size:12px;color:var(--sub)}
.cta{padding:15px 24px;border-radius:20px;background:var(--acc);color:var(--af);font-weight:700;font-size:15px;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 22px var(--ag);transition:.2s}
.cta:disabled{background:var(--in);color:var(--sub);box-shadow:none;cursor:default}
.b2{padding:10px 16px;border-radius:16px;font-weight:600;font-size:13.5px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge)}.b2:active{transform:scale(.96)}.b2.r{color:#ff6b60}.b2.g{color:#3ddc84}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px 12px 12px;border-radius:24px;text-align:left;margin-bottom:10px}
.row .th{flex:0 0 64px;height:56px;border-radius:14px;overflow:hidden}.row .th svg,.row .th img{width:100%;height:100%;display:block;object-fit:cover}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:14.5px}.row small{color:var(--sub);font-size:12px;line-height:1.35;display:block;margin-top:3px}.row .pr{font-weight:700;font-size:14px;white-space:nowrap}
.chk{flex:0 0 22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ge);background:var(--in);display:grid;place-items:center;transition:.2s}
.row.on .chk{background:var(--acc);color:var(--af);box-shadow:0 0 14px var(--ag)}.row.on .chk::after{content:"";width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.det{padding:14px 16px;margin:-2px 0 12px;border-radius:20px;animation:pop .4s}.det label,.ed label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:500}
.fld{width:100%;padding:14px 16px;border-radius:20px;outline:none;font-size:15px;border:0;background:var(--in);color:var(--txt);box-shadow:inset 0 0 0 1px var(--ge),inset 0 1px 1px rgba(255,255,255,.12);transition:box-shadow .2s}
.fld:focus{box-shadow:inset 0 0 0 1.5px var(--accent,var(--txt))}textarea.fld{resize:none;min-height:70px;line-height:1.45}
.col{display:flex;flex-direction:column;gap:10px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.dp{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 20px;border-radius:20px;font-size:15px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:13px 0;border-radius:16px;font-weight:600;font-size:13.5px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge);transition:.25s}
.slot:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}.slot.on{color:var(--af);background:var(--acc);box-shadow:0 0 14px var(--ag)}
.legend{font-size:12px;color:var(--sub);margin:10px 4px 0}
.bk{padding:20px;margin-bottom:14px;border-radius:24px}.bk .st{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.okb{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 0 18px var(--ag);color:var(--af)}
.okb.w{background:var(--in);box-shadow:inset 0 0 0 1px var(--ge);color:var(--txt)}.okb.n{background:#e5483d;color:#fff;box-shadow:0 0 18px rgba(229,72,61,.4)}
.okb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bk small{color:var(--sub);font-size:12.5px}.bk .tm{font-size:30px;font-weight:800;letter-spacing:-.04em;margin:2px 0 10px}.bk p{color:var(--sub);font-size:13.5px;line-height:1.55;margin-bottom:14px}.bk b{color:var(--txt)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:36px 24px;border-radius:24px}.empty p{color:var(--sub);margin:8px 0 18px}
.ed{padding:16px;margin-bottom:14px;border-radius:24px}.ed .pv{height:120px;border-radius:14px;overflow:hidden;margin-bottom:14px}.ed .pv svg,.ed .pv img{width:100%;height:100%;object-fit:cover;display:block}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:10px}
#app{padding-bottom:150px}
.fab{align-self:flex-end;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--af);background:var(--acc);box-shadow:0 10px 28px var(--ag)}
.sum{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-radius:24px}.sum .t{flex:1;line-height:1.2}.sum b{font-size:18px}.sum small{display:block;color:var(--sub);font-size:12px}

/* ============ НИЖНЕЕ МЕНЮ (ИДЕАЛЬНЫЙ CSS ПОЛЗУНОК) ============ */
.nav{display:flex;justify-content:space-around;padding:6px;border-radius:36px;position:relative;overflow:hidden;}
.ni{
  flex:1;text-align:center;color:var(--sub);font-size:11px;padding:8px 0;font-weight:600;
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .3s, transform .3s cubic-bezier(.3,1.3,.5,1);
  border-radius:28px;
}
.ni.on{color:var(--accent,var(--txt));}
.ni.on svg{transform:scale(1.15)}
.ni svg{transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
/* Фон самого ползунка */
.ni::before{
  content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:var(--as,rgba(255,255,255,.18));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px var(--sh);
  opacity:0;transform:scale(.85);
  transition:opacity .3s, transform .4s cubic-bezier(.3,1.3,.5,1);
}
.ni.on::before{opacity:1;transform:scale(1);}
body.light .ni::before{background:var(--as,rgba(0,0,0,.07));box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.1)}
.badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--txt);color:var(--bg);font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* ============ ШИТЫ ============ */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,440px);border-radius:32px 32px 0 0;animation:up .45s cubic-bezier(.22,.9,.25,1);padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--bg)}
body.dark .sheet{background:rgba(20,20,22,.7)}body.light .sheet{background:rgba(240,240,240,.8)}@keyframes up{from{transform:translateY(100%)}}

/* ============ КАЛЕНДАРЬ ============ */
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
.cal-header button { width: 32px; height: 32px; border-radius: 50%; background: var(--in); display: grid; place-items: center; color: var(--txt); }
.cal-header button:active { transform: scale(.9); }
.cal-month { font-size: 16px; font-weight: 700; text-transform: capitalize; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.cal-weekdays div { text-align: center; font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; border-radius: 12px; background: var(--in); box-shadow: inset 0 0 0 1px var(--ge); transition: .2s; cursor: pointer; }
.cal-day:hover { background: rgba(255,255,255,.1); }
.cal-day.empty { background: transparent; box-shadow: none; cursor: default; }
.cal-day.disabled { opacity: .3; cursor: not-allowed; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent,var(--txt)); font-weight: 700; }
.cal-day.on { background: var(--acc); color: var(--af); box-shadow: 0 0 12px var(--ag); }

/* ============ ЧАТ ============ */
.chat{height:min(84vh,680px);display:flex;flex-direction:column;padding:0;text-align:left}
.ch-h{display:flex;align-items:center;gap:12px;padding:16px 18px 14px}.ch-h b{display:block;font-size:16px}.ch-h small{color:var(--sub);font-size:12px}.ch-h .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge)}
#msgs{flex:1;overflow-y:auto;padding:8px 16px 4px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 14px;border-radius:18px;line-height:1.45;font-size:14.5px;animation:pop .35s}
.m.ai{background:var(--in);box-shadow:inset 0 0 0 1px var(--ge);border-top-left-radius:6px;align-self:flex-start}.m.me{background:var(--acc);color:var(--af);align-self:flex-end;border-top-right-radius:6px}
.dots{display:flex;gap:5px;padding:16px!important}.dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{transform:translateY(-4px);opacity:.4}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;min-height:48px}#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:99px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge);font-size:13.5px;font-weight:600;animation:pop .35s backwards}
.cin{display:flex;gap:8px;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}.cin input{flex:1;padding:13px 16px;border-radius:99px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge);border:0;outline:none;color:var(--txt);font-size:14px}
.cin button{flex:0 0 46px;height:46px;border-radius:50%;background:var(--acc);color:var(--af);display:grid;place-items:center}
.err{color:#ff6b60;font-size:12.5px;margin-top:8px;min-height:18px}
.pre,.sw{border-radius:20px;background:var(--in);box-shadow:inset 0 0 0 1px var(--ge)}.pres,.sws{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pre{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;font-weight:600}.pre i{width:12px;height:12px;border-radius:50%}
.sw{width:34px;height:34px;border-radius:50%;position:relative}.sw.on{outline:2px solid var(--txt);outline-offset:3px}.sw.rb{background:conic-gradient(#ff375f,#ff9f0a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff375f);overflow:hidden}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.tg{display:flex;justify-content:space-between;align-items:center;padding-top:14px}.tg span{font-size:14px;font-weight:500}
.tsw{width:50px;height:28px;border-radius:14px;background:rgba(120,120,140,.35);position:relative;transition:.3s}.tsw::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}.tsw.on{background:var(--accent,var(--txt))}.tsw.on::after{left:24px}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:13px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:300;max-width:90%;text-align:center;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ge),0 10px 30px var(--sh)}
.toast.show{opacity:1}.toast.act{pointer-events:auto}.toast .u{margin-left:8px;color:var(--accent,var(--txt));font-weight:700;text-decoration:underline;padding:6px}
.cf{position:fixed;left:50%;top:42%;z-index:400;pointer-events:none}.cf i{position:absolute;width:7px;height:11px;border-radius:2px;opacity:0;animation:cf 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{0%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 160px)) rotate(var(--r))}}
:focus-visible{outline:2px solid var(--accent,var(--txt));outline-offset:2px}
@media(prefers-reduced-motion:reduce){.ambient i{animation:none} .glass { animation: none; }}
</style></head>
<body class="dark">

function datesSheet() {
  var d = new Date(S.calYear, S.calMonth, 1);
  var monthName = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  var startDay = d.getDay() === 0 ? 6 : d.getDay() - 1; 
  var daysInMonth = new Date(S.calYear, S.calMonth + 1, 0).getDate();
  var today = new Date(); today.setHours(0,0,0,0);
  
  var gridHtml = '';
  for (var i = 0; i < startDay; i++) gridHtml += '<div class="cal-day empty"></div>';
  
  for (var day = 1; day <= daysInMonth; day++) {
    var current = new Date(S.calYear, S.calMonth, day);
    var isPast = current < today;
    var isToday = current.getTime() === today.getTime();
    var isSelected = S.day === day && S.calMonth === new Date().getMonth() && S.calYear === new Date().getFullYear();
    var cls = 'cal-day' + (isPast ? ' disabled' : '') + (isToday ? ' today' : '');
    if (isSelected) cls += ' on';
    gridHtml += '<div class="'+cls+'" data-a="pick-day" data-d="'+day+'" data-m="'+S.calMonth+'" data-y="'+S.calYear+'">'+day+'</div>';
  }

  $('modal').innerHTML = '<div class="veil" data-a="close"><div class="sheet">'+
    '<div class="cal-header">'+
      '<button data-a="cal-prev">'+ic('left')+'</button>'+
      '<div class="cal-month">'+monthName+'</div>'+
      '<button data-a="cal-next">'+ic('right')+'</button>'+
    '</div>'+
    '<div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>'+
    '<div class="cal-grid">'+gridHtml+'</div>'+
  '</div></div>';
}

 [[/стол|кухн|обеден/,'t1'],[/подоконник/,'t2'],[/панель|стен/,'t3'],[/раковин|ванн/,'t4'],[/ступен|лестниц/,'t5'],[/замер|консульт/,'t6']].forEach(function(k){if(k[0].test(t))got.push(k[1])});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,v=el.dataset.v,id=el.dataset.id;
  if((a==='close'||a==='closechat')&&el.classList.contains('veil')&&e.target!==el)return;
  if(a!=='theme'&&a!=='sendchat'&&a!=='pick-day')tick();
  
  if(a==='go')go(v);
  else if(a==='theme'){document.documentElement.classList.add('tt');setTimeout(function(){document.documentElement.classList.remove('tt')},500);S.theme=S.theme==='dark'?'light':'dark';save();applyLook();}
  else if(a==='quick'){S.sel={};S.sel[id]=true;S.tab='book';render()}
  else if(a==='svc'){S.sel[id]=!S.sel[id];render(true)}
  else if(a==='open-dates'){S.calMonth=new Date().getMonth();S.calYear=new Date().getFullYear();datesSheet();}
  else if(a==='cal-prev'){S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--}datesSheet();}
  else if(a==='cal-next'){S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++}datesSheet();}
  else if(a==='pick-day'){
    var now = new Date();
    var target = new Date(S.calYear, S.calMonth, +el.dataset.d);
    var diff = Math.floor((target - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    if(diff >= 0 && diff < 14) {
       S.day = diff; CH.day = true; S.slot = null; $('modal').innerHTML=''; render(true);
    } else {
       toast('Можно записаться только на 2 недели вперед');
    }
  }
  else if(a==='slot'){S.slot=v;render(true)}
  else if(a==='cancel'){var snap=S.book.slice();S.book=S.book.filter(function(b){return b.id!=id});save();render(true);toast('Запись отменена',function(){S.book=snap;save();render(true)})}
  else if(a==='confirm'){if(blocker())return;var b=finalize();S.tab='mine';render();sheet(b)}
  else if(a==='close'||a==='closechat')$('modal').innerHTML='';
  else if(a==='chat')openChat();
  else if(a==='sendchat'){var i=$('cin');send(i.value);i.value=''}
  else if(a==='chip'){if(v==='Открыть мои записи'){$('modal').innerHTML='';go('mine')}else if(v==='Записаться')send('хочу записаться');else send(v)}
  else if(a==='owner')pinSheet();
  else if(a==='pin')tryPin();
  else if(a==='bk-ok'||a==='bk-no'){S.book.forEach(function(b){if(b.id==id)b.status=a==='bk-ok'?'ok':'no'});save();render(true)}
  else if(a==='bk-del'){S.book=S.book.filter(function(b){return b.id!=id});save();render(true)}
  else if(a==='sv-add'){SV.push({id:'s'+Date.now(),n:'Новая услуга',p:1000,t:30,k:'car',w:'Опишите, что клиент получит от этой услуги.',h:''});save();render(true);scrollTo(0,document.body.scrollHeight)}
  else if(a==='sv-del'){if(SV.length>1){SV=SV.filter(function(s){return String(s.id)!==String(id)});delete S.sel[id];save();render(true)}}
  else if(a==='img'){FPT=id;$('fp').click()}
  else if(a==='img-reset'){if(id==='hero')B.img='';else{var s2=SV.filter(function(x){return String(x.id)===String(id)})[0];if(s2)delete s2.img}save();render(true)}
  else if(a==='save-brand'){save();burst();ok();toast('Изменения сохранены')}
  else if(a==='u-acc'){setAcc(v);render(true)}
  else if(a==='u-pre'){var q=PRE[+v];L.accent=q[1];L.tint=!!q[2];L.tt=1;save();applyLook();render(true)}
  else if(a==='u-tint'){if(!L.accent){toast('Сначала выберите цвет');return}L.tint=!L.tint;L.tt=1;save();applyLook();render(true)}
  else if(a==='u-snd'){L.sound=!L.sound;save();render(true);ok()}
});

const parallaxElements = document.querySelectorAll('.glass, .sheet, .nav');
document.addEventListener('pointermove', (e) => {
  parallaxElements.forEach(el => {
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    el.style.setProperty('--mx', `${x}px`);
    el.style.setProperty('--my', `${y}px`);
  });
}, { passive: true });

// Service Worker для PWA
if('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'keramo-v2';
    const ASSETS = ['./'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
